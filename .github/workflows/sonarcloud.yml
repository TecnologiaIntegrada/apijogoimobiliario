name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # NÃO BLOQUEIA o pipeline se falhar
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=TecnologiaIntegrada_apijogoimobiliario
            -Dsonar.organization=tecnologiaintegrada
            -Dsonar.sources=app
            -Dsonar.python.version=3.11
            -Dsonar.qualitygate.wait=false

      - name: Análise Completa
        run: |
          echo '✅ Análise SonarCloud executada (não-bloqueante)'
          echo '📊 Veja os resultados em: https://sonarcloud.io'
