apiVersion: apps/v1
kind: Deployment
metadata:
  name: apijogoimobiliario
  namespace: apijogoimobiliario
  labels:
    app: apijogoimobiliario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apijogoimobiliario
  template:
    metadata:
      labels:
        app: apijogoimobiliario
    spec:
      # imagePullSecrets:
      # - name: ghcr-secret
      containers:
      - name: api
        image: ghcr.io/tecnologiaintegrada/apijogoimobiliario:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        # Adicione suas variáveis de ambiente aqui
        # - name: DATABASE_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: api-secrets
        #       key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
